function submitAiPrompt(prompt,model,chatMessageId){
  var requestId='ai-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
  setAiPending(requestId,true);
  fetch('/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:prompt,model:model,requestId:requestId,chatMessageId:chatMessageId})})
    .then(function(r){return r.json().catch(function(){return{}}).then(function(data){if(!r.ok)throw new Error(data.error||'AI request failed');return data})})
    .then(function(msg){clearAiPending(requestId);if(msg&&msg.id&&!document.querySelector('[data-msg-id="'+msg.id+'"]'))addChatMsg(msg)})
    .catch(function(error){clearAiPending(requestId);notify('❌ AI: '+translateUiValue(error.message),'error')})
}function chatSend(){
  if(window.chatSending)return;
  if(!SESSION||!SESSION.permissions||!SESSION.permissions.chatWrite){notify('❌ Нет права на отправку','error');return}
  var input=document.getElementById('chatInput');
  var text=input.value.trim(),prompt=null,model=null;
  if(text.startsWith('/ai ')){prompt=text.substring(4).trim();if(!prompt){notify('❌ Enter a prompt','error');return}}
  else if(text.startsWith('/Cai ')){var parts=text.split(' ');model=parts[1];prompt=parts.slice(2).join(' ').trim();if(!prompt){notify('❌ Usage: /Cai model prompt','error');return}}
  if(!text&&!chatPendingFiles.length)return;
  if(chatPendingFiles.length&&(!SESSION.permissions||!SESSION.permissions.chatUpload)){notify('❌ Нет права на загрузку файлов','error');return}
  window.chatSending=true;
  var sendButton=document.getElementById('chatSendButton');if(sendButton)sendButton.disabled=true;
  var body={text:text,attachments:[]};
  if(chatReplyTo)body.replyTo=chatReplyTo;
  chatPendingFiles.reduce(function(chain,attachment){return chain.then(function(){return uploadChatAttachment(attachment)})},Promise.resolve())
    .then(function(){body.attachments=chatPendingFiles.map(function(a){return a.id});return fetch('/api/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})})
    .then(function(r){return r.json().catch(function(){return{}}).then(function(data){if(!r.ok)throw new Error(data.error||'Ошибка отправки');return data})})
    .then(function(message){
      input.value='';chatReplyTo=null;input.placeholder='Напишите сообщение...';
      chatPendingFiles.forEach(function(a){if(a.previewUrl)URL.revokeObjectURL(a.previewUrl)});chatPendingFiles=[];renderChatAttachments();
      if(prompt)submitAiPrompt(prompt,model,message.id)
    })
    .catch(function(error){notify('❌ '+translateUiValue(error.message),'error')})
    .finally(function(){window.chatSending=false;if(sendButton)sendButton.disabled=false})
}
function chatUploadError(xhr,fallback){
  try{var body=JSON.parse(xhr.responseText||'{}');if(body.error||body.message)return translateUiValue(String(body.error||body.message))}catch(e){}
  return translateUiValue(fallback)+(xhr.status?' (HTTP '+xhr.status+')':' (network error)')
}var chatPendingFiles=[];
function queueChatAttachments(files){
  if(!files||!files.length)return;
  if(window.chatSending){notify(translateUiValue('Дождитесь отправки текущего сообщения'),'info');return}
  if(!SESSION||!SESSION.permissions||!SESSION.permissions.chatUpload){notify('❌ Нет права на загрузку файлов','error');return}
  Array.from(files).forEach(function(file){
    if(chatPendingFiles.length>=10){notify(translateUiValue('Можно прикрепить не более 10 файлов'),'error');return}
    var image=file.type&&file.type.startsWith('image/');
    chatPendingFiles.push({file:file,id:null,name:file.name,size:file.size,type:image?'image':'file',previewUrl:image?URL.createObjectURL(file):null})
  });
  renderChatAttachments()
}
function renderChatAttachments(){
  var el=document.getElementById('chatAttachments');if(!el)return;
  el.innerHTML='';el.classList.toggle('has-items',chatPendingFiles.length>0);
  chatPendingFiles.forEach(function(a,index){
    var chip=document.createElement('div');chip.className='chat-attachment-chip';
    if(a.previewUrl){var img=document.createElement('img');img.src=a.previewUrl;img.alt='';chip.appendChild(img)}
    else{var icon=document.createElement('span');icon.style.fontSize='20px';icon.textContent='📎';chip.appendChild(icon)}
    var meta=document.createElement('span');meta.className='attachment-meta';meta.title=a.name;meta.appendChild(document.createTextNode(a.name));
    var size=document.createElement('span');size.style.color='var(--text2)';size.textContent=(a.id?'✓ ':'')+fmtSize(a.size);meta.appendChild(document.createElement('br'));meta.appendChild(size);chip.appendChild(meta);
    var remove=document.createElement('button');remove.className='attachment-remove';remove.title=translateUiValue('Убрать вложение');remove.textContent='✕';remove.onclick=function(){removeChatAttachment(index)};chip.appendChild(remove);
    el.appendChild(chip)
  })
}
function removeChatAttachment(index){
  if(window.chatSending)return;
  var a=chatPendingFiles[index];if(!a)return;
  if(a.previewUrl)URL.revokeObjectURL(a.previewUrl);
  if(a.id)fetch('/api/chat/upload/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:a.id})}).catch(function(){});
  chatPendingFiles.splice(index,1);renderChatAttachments()
}
function uploadChatAttachment(a){
  if(a.id)return Promise.resolve(a.id);
  return new Promise(function(resolve,reject){
    var fd=new FormData();fd.append('file',a.file);
    var xhr=new XMLHttpRequest();xhr.open('POST','/api/chat/upload',true);
    var nid=notify('📤 Загрузка: '+a.name,'info',true,function(){xhr.abort()});
    xhr.upload.onprogress=function(e){if(e.lengthComputable)updateNotif(nid,'📤 Загрузка: '+Math.round(e.loaded/e.total*100)+'% ('+fmtSize(e.loaded)+'/'+fmtSize(e.total)+')','info')};
    xhr.onload=function(){completeNotif(nid);dismissNotif(nid);if(xhr.status>=200&&xhr.status<300){try{var d=JSON.parse(xhr.responseText);a.id=d.attachment.id;a.type=d.attachment.type;renderChatAttachments();resolve(a.id)}catch(e){reject(new Error('Не удалось получить данные вложения'))}}else reject(new Error(chatUploadError(xhr,'Ошибка загрузки')))};
    xhr.onerror=function(){completeNotif(nid);dismissNotif(nid);reject(new Error(chatUploadError(xhr,'Ошибка загрузки')))};
    xhr.onabort=function(){completeNotif(nid);dismissNotif(nid);reject(new Error('Загрузка отменена'))};
    xhr.send(fd)
  })
}

function chatDropFile(e){
  e.preventDefault();
  queueChatAttachments(e.dataTransfer.files)
}

// ============================================================
// NOTIFICATIONS
// ============================================================
// GLOBAL CANCEL MAP
var __CANCEL_MAP = {};

function notify(text,type,persist,onCancel){
  type=type||'info';
  var id=++NOTIF_ID;
  if(onCancel)__CANCEL_MAP[id]=onCancel;
  var el=document.getElementById('notifications');
  var n=document.createElement('div');n.className='notification '+type;n.id='n_'+id;
  n.innerHTML='<span>'+esc(text)+'</span>'+(onCancel?'<span class="notif-cancel" style="margin-left:6px;cursor:pointer;opacity:0.5;font-weight:bold" onclick="cancelNotif('+id+')">✕</span>':'');
  n.onclick=function(){dismissNotif(id)};
  n._onCancel=onCancel||null;
  el.appendChild(n);
  NOTIFICATIONS.push({id:id,text:text,type:type,time:Date.now(),onCancel:onCancel||null});
  if(!persist)setTimeout(function(){dismissNotif(id)},5000);
  return id
}
function dismissNotif(id){
  var n=document.getElementById('n_'+id);
  if(n)n.style.display='none'
}
function completeNotif(id){
  delete __CANCEL_MAP[id];
  for(var i=0;i<NOTIFICATIONS.length;i++){if(NOTIFICATIONS[i].id===id)NOTIFICATIONS[i].onCancel=null}
  var n=document.getElementById('n_'+id);
  if(n){n._onCancel=null;var cancel=n.querySelector('.notif-cancel');if(cancel)cancel.remove()}
}function cancelNotif(id){
  // Try cancel map first, then DOM, then array
  if(__CANCEL_MAP[id]){
    __CANCEL_MAP[id](id);
    delete __CANCEL_MAP[id];
    // Also update array
    for(var i=0;i<NOTIFICATIONS.length;i++){
      if(NOTIFICATIONS[i].id===id){NOTIFICATIONS[i].onCancel=null;break}
    }
    var n=document.getElementById('n_'+id);
    if(n)n.remove()
  }
}
function updateNotif(id,text,type){
  var n=document.getElementById('n_'+id);
  if(!n)return id;
  type=type||'info';
  n.className='notification '+type;
  if(n.style.display==='none')n.style.display='';
  var onCancel=n._onCancel;
  n.innerHTML='<span>'+esc(text)+'</span>'+(onCancel?'<span class="notif-cancel" style="margin-left:6px;cursor:pointer;opacity:0.5;font-weight:bold" onclick="cancelNotif('+id+')">✕</span>':'');
  n._onCancel=onCancel;
  // Update stored notification
  for(var i=0;i<NOTIFICATIONS.length;i++){
    if(NOTIFICATIONS[i].id===id){NOTIFICATIONS[i].text=text;NOTIFICATIONS[i].type=type;NOTIFICATIONS[i].onCancel=onCancel;break}
  }
  return id
}
function openNotifCenter(){
  var m=document.getElementById('modalContent');
  m.classList.add('wide');
  var html='<h3>🔔 Центр уведомлений</h3>';
  if(NOTIFICATIONS.length===0)html+='<div style="text-align:center;padding:20px;color:var(--text2)">Нет уведомлений</div>';
  else{
    html+='<div style="max-height:400px;overflow-y:auto">';
    NOTIFICATIONS.slice().reverse().forEach(function(n){
      var time=new Date(n.time).toLocaleString('ru',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      var cancelBtn=n.onCancel?'<button style="padding:2px 6px;font-size:10px;color:var(--danger);background:transparent;border:1px solid var(--danger);border-radius:3px;cursor:pointer" onclick="cancelNotif('+n.id+')">✕</button>':'';

async function openWakeModal(){
  if(!SESSION||!SESSION.permissions||!SESSION.permissions.power){
    notify('❌ Нет доступа к Wake-on-LAN','error');
    return;
  }
  var m=document.getElementById('modalContent');
  m.classList.remove('wide');
  m.innerHTML='<h3>⚡ Wake-on-LAN</h3><div id="wolDevices" style="display:flex;flex-direction:column;gap:5px;max-height:360px;overflow-y:auto"><div style="text-align:center;padding:15px;color:var(--text2)">⏳ Загрузка устройств...</div></div><details style="margin-top:10px"><summary style="cursor:pointer;color:var(--accent);font-size:11px;font-weight:600">➕ Добавить устройство</summary><div style="padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;margin-top:6px"><label>Название</label><input id="wolName" placeholder="Мой компьютер"><label>MAC-адрес</label><input id="wolMac" placeholder="AA:BB:CC:DD:EE:FF"><div class="modal-actions"><button class="btn-primary" onclick="addWakeDevice()">Добавить</button></div></div></details><div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Закрыть</button></div>';
  document.getElementById('modalOverlay').classList.add('show');
  await loadWakeDevices();
}
async function loadWakeDevices(){
  var el=document.getElementById('wolDevices');
  if(!el)return;
  try{
    var r=await fetch('/api/devices',{cache:'no-store'});
    var d=await r.json();
    if(!r.ok)throw new Error(d.error||'HTTP '+r.status);
    if(!Array.isArray(d)||!d.length){
      el.innerHTML='<div style="text-align:center;padding:15px;color:var(--text2)">Нет сохранённых устройств.</div>';
      return;
    }
    el.innerHTML=d.map(function(dev){
      return '<div style="display:flex;align-items:center;gap:7px;padding:7px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px"><div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:600;color:var(--text)">'+esc(dev.name||'Без имени')+'</div><div style="font-size:9px;color:var(--text2);font-family:monospace">'+esc(dev.mac||'')+'</div></div><button style="padding:5px 9px;border:1px solid var(--success);background:transparent;color:var(--success);border-radius:4px;cursor:pointer;font-size:10px" onclick="wakeDevice(\''+escJs(dev.mac||'')+'\')">⚡ Включить</button><button style="padding:5px 7px;border:1px solid var(--danger);background:transparent;color:var(--danger);border-radius:4px;cursor:pointer;font-size:10px" onclick="deleteWakeDevice(\''+escJs(String(dev.id))+'\')">✕</button></div>';
    }).join('');
  }catch(e){
    el.innerHTML='<div style="padding:15px;color:var(--danger);text-align:center">❌ '+esc(e.message)+'</div>';
  }
}
async function wakeDevice(mac){
  try{
    var r=await fetch('/api/wake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mac:mac})});
    var d=await r.json().catch(function(){return{success:false,error:'HTTP '+r.status}});
    if(r.ok&&d.success)notify('⚡ Magic Packet отправлен: '+mac,'success');
    else notify('❌ Не удалось отправить Wake-on-LAN: '+(d.error||'неизвестная ошибка'),'error');
  }catch(e){notify('❌ Ошибка Wake-on-LAN: '+e.message,'error')}
}
async function addWakeDevice(){
  var name=(document.getElementById('wolName').value||'').trim();
  var mac=(document.getElementById('wolMac').value||'').trim();
  if(!name){notify('Введите название устройства','error');return}
  if(!/^(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$/.test(mac)){notify('Некорректный MAC-адрес','error');return}
  try{
    var r=await fetch('/api/devices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,mac:mac})});
    var d=await r.json().catch(function(){return{}});
    if(!r.ok)throw new Error(d.error||'HTTP '+r.status);
    document.getElementById('wolName').value='';document.getElementById('wolMac').value='';
    notify('✅ Устройство добавлено','success');
    await loadWakeDevices();
  }catch(e){notify('❌ '+e.message,'error')}
}
async function deleteWakeDevice(id){
  if(!confirm('Удалить это устройство из Wake-on-LAN?'))return;
  try{
    var r=await fetch('/api/devices/'+encodeURIComponent(id),{method:'DELETE'});
    var d=await r.json().catch(function(){return{}});
    if(!r.ok)throw new Error(d.error||'HTTP '+r.status);
    await loadWakeDevices();
  }catch(e){notify('❌ '+e.message,'error')}
}
function escJs(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'\\r')}

// ============================================================
// REMOTE CONTROL
// Скриншоты грузятся через fetch (а не <img src>), поэтому ошибки сервера
// показываются текстом поверх экрана, а не «иконкой сломанного файла».
// ============================================================
var remoteMonitors = [];          // оставлено для совместимости со старым кодом инициализации
var remoteRunning = false;
var remoteTimer = null;
var remoteLastUrl = null;
var remoteSourceWidth = 0, remoteSourceHeight = 0;
var remoteQueue = Promise.resolve();

// Ошибки должны повисеть не меньше 10 секунд, даже если за это время успешно
// прогрузился следующий кадр — remoteStatusUntil хранит момент, раньше
// которого статус нельзя скрывать/затирать.
var remoteStatusUntil = 0;
function remoteShowStatus(text){
  var el=document.getElementById('remoteStatus');
  if(!el)return;
  if(text){
    el.classList.remove('status-success','status-info','status-warning','status-error');
    var cls=text.indexOf('✅')===0?'status-success':(text.indexOf('⚠️')===0?'status-warning':(text.indexOf('❌')===0?'status-error':'status-info'));
    el.classList.add(cls);el.textContent=text;el.style.display='block';
    remoteStatusUntil=Date.now()+10000
  }else{
    if(Date.now()<remoteStatusUntil)return;
    el.style.display='none'
  }
}
function openRemote(){
  document.getElementById('remotePanel').classList.add('open');
  var screen=document.getElementById('remoteScreen');
  screen.onclick=function(e){remoteImgClick(e,1)};
  screen.oncontextmenu=function(e){e.preventDefault();remoteImgClick(e,3);return false};
  screen.onauxclick=function(e){if(e.button===1){e.preventDefault();remoteImgClick(e,2)}};
  screen.onmousemove=remoteHoverMove;
  screen.onmouseleave=function(){remoteHoverTarget=null};
  remoteHoverLast=null;remoteHoverTarget=null;remoteHoverBusy=false;
  var body=document.getElementById('remoteBody');
  body.tabIndex=0;
  body.onkeydown=function(e){remoteKeyDown(e)};
  body.focus();
  body.onpointerdown=function(){body.focus()};
  if(!window.__remoteGlobalKeys){window.__remoteGlobalKeys=function(e){if(!remoteRunning)return;if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable))return;if(['Control','Shift','Alt','Meta','CapsLock','Dead','Process'].includes(e.key))return;e.preventDefault();remoteSend({action:'key',key:e.key,ctrl:e.ctrlKey,alt:e.altKey,shift:e.shiftKey,meta:e.metaKey})};window.addEventListener('keydown',window.__remoteGlobalKeys,true)}
  remoteStop();
  remoteRunning=true;
  remoteLoop();
  // Warm up the Wayland input backend immediately instead of waiting for the
  // first click/key, so the first interaction does not race portal startup.
  setTimeout(remoteConnectInput,150);
  setTimeout(function(){var img=document.getElementById('remoteScreen');if(img){img.style.width='100%';img.style.height='100%';}var body=document.getElementById('remoteBody');if(body)body.scrollTop=0;},50);
}
function remoteStop(){
  remoteRunning=false;
  if(remoteTimer){clearTimeout(remoteTimer);remoteTimer=null}
}
function closeRemote(){
  document.getElementById('remotePanel').classList.remove('open');
  remoteStop();
  remoteHoverTarget=null;
  remoteDiagClose()
}
function remoteFullscreen(){
  document.getElementById('remotePanel').classList.toggle('fullscreen')
}
function remoteRefresh(){
  remoteStop();remoteRunning=true;remoteLoop()
}
// Один запрос за раз: следующий кадр запрашивается только после завершения предыдущего
async function remoteLoop(){
  if(!remoteRunning)return;
  var delay=120;
  try{
    var r=await fetch('/api/system/remote/screenshot?format=webp&quality='+(window.innerWidth<700?'62':'68')+'&maxWidth='+(window.innerWidth<700?'1280':'1920')+'&t='+Date.now(),{cache:'no-store'});
    var ct=r.headers.get('content-type')||'';
    remoteSourceWidth=parseInt(r.headers.get('X-Image-Width')||'0',10)||0;
    remoteSourceHeight=parseInt(r.headers.get('X-Image-Height')||'0',10)||0;
    if(r.ok&&ct.indexOf('image')===0){
      var blob=await r.blob();
      var url=URL.createObjectURL(blob);
      var img=document.getElementById('remoteScreen');
      var prev=remoteLastUrl;
      img.onload=function(){if(prev)URL.revokeObjectURL(prev)};
      img.src=url;
      remoteLastUrl=url;
      remoteShowStatus('')
    }else{
      var msg;
      try{msg=(await r.json()).error}catch(e){msg=(r.redirected||r.status===200)?'Сессия истекла — войдите заново':('HTTP '+r.status)}
      remoteShowStatus('❌ Не удалось получить экран:\n'+msg+'\n\nНажмите 🩺 для диагностики.');
      delay=4000
    }
  }catch(e){
    remoteShowStatus('❌ Нет связи с панелью: '+e.message);
    delay=4000
  }
  if(remoteRunning)remoteTimer=setTimeout(remoteLoop,delay)
}
// Все команды ввода идут строго по очереди, чтобы не перепутался порядок
function remoteSend(payload){
  remoteQueue=remoteQueue.then(function(){
    return fetch('/api/system/remote/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(function(r){return r.json().catch(function(){return{success:false,error:'HTTP '+r.status}})})
      .then(function(d){if(!d.success)remoteShowStatus('❌ Ввод не сработал:\n'+(d.error||'неизвестная ошибка'))})
      .catch(function(e){remoteShowStatus('❌ Нет связи с панелью: '+e.message)})
  });
  return remoteQueue
}
// Координаты на удалённом экране с учётом object-fit:contain
function remoteCoords(e){var img=document.getElementById('remoteScreen');if(!img||!img.naturalWidth)return null;var r=img.getBoundingClientRect(),sc=Math.min(r.width/img.naturalWidth,r.height/img.naturalHeight),ox=(r.width-img.naturalWidth*sc)/2,oy=(r.height-img.naturalHeight*sc)/2,x=Math.round((e.clientX-r.left-ox)/sc),y=Math.round((e.clientY-r.top-oy)/sc);if(x<0||y<0||x>img.naturalWidth||y>img.naturalHeight)return null;var sw=remoteSourceWidth||img.naturalWidth,sh=remoteSourceHeight||img.naturalHeight;if(img.naturalWidth!==sw||img.naturalHeight!==sh){x=Math.round(x*sw/img.naturalWidth);y=Math.round(y*sh/img.naturalHeight)}return{x:x,y:y}}

function remoteImgClick(e,button){
  var c=remoteCoords(e);
  if(!c)return;
  remoteSend({action:'click',button:button,x:c.x,y:c.y});
  setTimeout(remoteRefresh,400)
}
// Слежение за курсором: пока панель открыта, реальный курсор на удалённой
// машине постоянно доводится туда, где сейчас мышь в браузере. Запросы идут
// через ту же очередь remoteSend, что и клики/клавиши — это сохраняет порядок
// (клик всегда происходит после последнего наведения) и не даёт запросам
// копиться: следующее наведение ставится в очередь только после того, как
// предыдущее реально доехало до сервера.
var remoteHoverLast=null, remoteHoverTarget=null, remoteHoverBusy=false;
function remoteHoverSend(){
  if(remoteHoverBusy||!remoteHoverTarget)return;
  var c=remoteHoverTarget;
  remoteHoverTarget=null;
  remoteHoverBusy=true;
  remoteHoverLast=c;
  remoteSend({action:'move',x:c.x,y:c.y}).finally(function(){
    remoteHoverBusy=false;
    remoteHoverSend()
  })
}
function remoteHoverMove(e){
  var c=remoteCoords(e);
  if(!c)return;
  if(remoteHoverLast&&Math.abs(c.x-remoteHoverLast.x)<3&&Math.abs(c.y-remoteHoverLast.y)<3)return;
  remoteHoverTarget=c;
  remoteHoverSend()
}
// Кнопки тулбара кликают там, где сейчас стоит курсор
function remoteClick(button){remoteSend({action:'click',button:button})}
function remoteDblClick(){remoteSend({action:'dblclick',button:1})}
function remoteKeyType(val){
  if(!val)return;
  remoteSend({action:'type',text:val})
}
function remoteKeyDown(e){
  if(e.target&&e.target.id==='remoteKeyInput')return;
  var k=e.key;
  /* Android/mobile browsers may report touch/IME/system events as Unidentified. */
  if(!k||k==='Unidentified')return;
  if(k==='Control'||k==='Shift'||k==='Alt'||k==='Meta'||k==='CapsLock'||k==='Dead'||k==='Process')return;
  e.preventDefault();
  remoteSend({action:'key',key:k,ctrl:e.ctrlKey,alt:e.altKey,shift:e.shiftKey,meta:e.metaKey})
}
// Диагностика — отдельный оверлей поверх всего остального (в т.ч. поверх
// ошибок в remoteStatus) и закрывается только по кнопке ✕, а не по таймеру
// и не при следующем удачном кадре скриншота.
function remoteDiagShow(text){
  document.getElementById('remoteDiagContent').textContent=text;
  document.getElementById('remoteDiag').style.display='block'
}
function remoteDiagClose(){
  document.getElementById('remoteDiag').style.display='none'
}
function remoteConnectInput(){
  remoteShowStatus('⏳ Подключаю управление…');
  fetch('/api/system/remote/input/status',{cache:'no-store'}).then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d}})}).then(function(x){
    var d=x.data||{};
    if(x.ok&&d.state==='ready') remoteShowStatus('✅ Управление подключено');
    else if(d.state==='awaiting-auth') remoteShowStatus('⚠️ KDE ждёт подтверждения управления вводом на графическом экране. Подтвердите доступ и нажмите «🔌 Ввод» ещё раз.');
    else remoteShowStatus('❌ Не удалось подключить ввод:\n'+(d.error||'неизвестная ошибка'));
  }).catch(function(e){remoteShowStatus('❌ '+e.message)})
}
function remoteEnsureSession(){
  remoteShowStatus('⏳ Проверяю графическую сессию…');
  fetch('/api/system/remote/session/ensure',{method:'POST'}).then(function(r){return r.json()}).then(function(d){
    if(d.success){remoteShowStatus('✅ '+(d.message||'Графическая сессия доступна'));remoteRefresh()}
    else remoteShowStatus('⚠️ '+(d.error||'Не удалось запустить графическую сессию')+'\n\nОткройте 🩺 Диагностику для подробностей.');
  }).catch(function(e){remoteShowStatus('❌ '+e.message)});
}
function remoteDiagnose(){
  remoteDiagShow('⏳ Диагностика...');
  fetch('/api/system/remote/diagnose',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    remoteDiagShow(JSON.stringify(d,null,2))
  }).catch(function(e){remoteDiagShow('❌ '+e.message)})
}

// ============================================================
// SERVER FILE PICKER
// ============================================================
var spfLoadedFiles = [];
function openServerFilePicker(){
  var m = document.getElementById('modalContent');
  m.classList.add('wide');
  var html = '<h3>📁 Выберите файл для отправки</h3>';
  html += '<div style="display:flex;gap:4px;margin-bottom:6px">';
  html += '<button onclick="spfBack()" id="spfBack" style="display:none">⬅</button>';
  html += '<button onclick="spfFwd()" id="spfFwd" style="display:none">➡</button>';
  html += '<span style="flex:1;font-size:11px;padding:4px;background:var(--bg);border-radius:3px" id="spfPath">/</span>';
  html += '<button onclick="spfSend()" id="spfSend" style="display:none;background:var(--accent);color:white;border:none;border-radius:3px;padding:4px 10px;cursor:pointer;font-weight:600">📤 Отправить в чат</button></div>';
  html += '<div id="spfFiles" style="max-height:400px;overflow-y:auto;background:var(--bg);border-radius:5px;padding:4px"></div>';
  html += '<div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Отмена</button></div>';
  m.innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
  window._spfPath = '/';
  window._spfHistory = ['/'];
  window._spfHistoryIdx = 0;
  window._spfSelected = null;
  spfLoad('/')
}
function spfLoad(path){
  window._spfPath = path;
  document.getElementById('spfPath').textContent = path;
  fetch('/api/files?path='+encodeURIComponent(path)).then(function(r){return r.json()}).then(function(data){
    var files = data.files || data;
    spfLoadedFiles = files;
    document.getElementById('spfBack').style.display = window._spfHistoryIdx > 0 ? '' : 'none';
    document.getElementById('spfFwd').style.display = window._spfHistoryIdx < window._spfHistory.length-1 ? '' : 'none';
    var el = document.getElementById('spfFiles');
    el.innerHTML = '';
    files.forEach(function(f){
      var div = document.createElement('div');
      div.style.cssText = 'padding:4px 6px;cursor:pointer;border-radius:3px;display:flex;align-items:center;gap:6px;font-size:11px';
      div.onmouseover = function(){this.style.background='var(--hover)'};
      div.onmouseout = function(){this.style.background=''};
      if(f.isDirectory){
        div.innerHTML = '📁 '+esc(f.name);
        div.ondblclick = function(){spfNavigate(f.name)};
      } else {
        div.innerHTML = '📄 '+esc(f.name)+' <span style="color:var(--text2);font-size:9px">'+fmtSize(f.size)+'</span>';
        div.ondblclick = function(){
          window._spfSelected = f;
          document.getElementById('spfSend').style.display = '';
          document.querySelectorAll('#spfFiles > div').forEach(function(d){d.style.border=''});
          div.style.border = '2px solid var(--accent)';
        };
      }
      el.appendChild(div);
    })
  })
}
function spfNavigate(name){
  window._spfHistory = window._spfHistory.slice(0, window._spfHistoryIdx + 1);
  window._spfHistory.push(window._spfPath + (window._spfPath.endsWith('/')?'':'/') + name);
  window._spfHistoryIdx = window._spfHistory.length - 1;
  spfLoad(window._spfHistory[window._spfHistoryIdx]);
}
function spfBack(){if(window._spfHistoryIdx>0){window._spfHistoryIdx--;spfLoad(window._spfHistory[window._spfHistoryIdx])}}
function spfFwd(){if(window._spfHistoryIdx<window._spfHistory.length-1){window._spfHistoryIdx++;spfLoad(window._spfHistory[window._spfHistoryIdx])}}
function spfSend(){
  var f = window._spfSelected;
  if(!f)return;
  closeModal();
  fetch('/api/view?path='+encodeURIComponent(f.path)).then(function(r){if(!r.ok)throw new Error('Не удалось прочитать файл');return r.blob()}).then(function(blob){
    var file = new File([blob], f.name, {type:blob.type||'application/octet-stream'});
    queueChatAttachments([file]);
  }).catch(function(e){notify('❌ '+e.message,'error')})
}

// ============================================================
// INIT
// ============================================================
async function init(){
  await loadSession();
  await loadThemes();
  await loadButtons();
  // Show Wake-on-LAN only for users with the power-management permission.
  if(SESSION&&SESSION.permissions&&SESSION.permissions.power){
    var wolBtn=document.getElementById('wolBtn');
    if(wolBtn)wolBtn.style.display='';
  }
  // Load panel settings
  try{var r=await fetch('/api/settings');if(r.ok)PANEL_SETTINGS=await r.json()}catch(e){}
  // Load AI config
  try{var r=await fetch('/api/ai/config');if(r.ok)AI_CONFIG=await r.json()}catch(e){}
  // Load chat color
  loadChatColor();
  // Init chat if permission
  if(SESSION&&SESSION.permissions&&SESSION.permissions.chatRead)initChat();
  // Check permissions for tabs
  if(SESSION&&SESSION.permissions){
    document.querySelectorAll('.tab-btn[data-tab]').forEach(function(btn){
      var tab=btn.dataset.tab;
      var permMap={chat:'chatRead',tasks:'tasks'};
      if(permMap[tab]&&!SESSION.permissions[permMap[tab]]){
        btn.style.display='none';
        var panel=document.getElementById('tab-'+tab);
        if(panel)panel.innerHTML='<div class="no-access">🚫 Нет доступа к этому разделу</div>'
      }
    })
  }
  var fm=createFileManager('/');
  if(fm)fm.tabBtn.click();
  initConsoleResize();
  // Check GPU availability and show remote button
  fetch('/api/system/gpu').then(function(r){return r.json()}).then(function(data){
    document.getElementById('remoteBtn').style.display='';
    if(data.gpus)remoteMonitors=data.gpus
  }).catch(function(){document.getElementById('remoteBtn').style.display='' });
  // Remote panel resize
  var remoteResize = document.getElementById('remoteResize');
  if(remoteResize){
    remoteResize.addEventListener('mousedown',function(e){
      e.preventDefault();
      var startY=e.clientY;
      var panel=document.getElementById('remotePanel');
      var startH=panel.offsetHeight;
      function onMove(e2){
        var h=Math.max(50,Math.min(window.innerHeight-20,startH-(e2.clientY-startY)));
        panel.style.height=h+'px'
      }
      function onUp(){document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp)}
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp)
    })
  }
}
init();
</script>
