function setConnectionState(online){
  const status=document.getElementById('connectionStatus');if(!status)return;
  status.classList.toggle('offline',!online);status.lastElementChild.textContent=online?'Online':'Offline'
}
window.addEventListener('offline',()=>setConnectionState(false));window.addEventListener('online',()=>setConnectionState(true));
function startTm(){S.tmActive=true;if(S.tmRefresh)clearTimeout(S.tmRefresh);tmFetch()}
function stopTm(){S.tmActive=false;if(S.tmRefresh){clearTimeout(S.tmRefresh);S.tmRefresh=null}if(S.tmController){S.tmController.abort();S.tmController=null}}
async function tmFetch(){
  if(!S.tmActive||S.tmController)return;
  if(document.hidden){S.tmRefresh=setTimeout(tmFetch,5000);return}
  const controller=new AbortController();S.tmController=controller;const timeout=setTimeout(()=>controller.abort(),10000);
  try{
    const r=await fetch('/api/taskmanager',{signal:controller.signal});
    if(r.status===401){window.location.replace('/login');return}
    if(r.status===423){window.location.replace('/block.html');return}
    if(!r.ok){const data=await r.json().catch(()=>({}));throw new Error(data.error||'HTTP '+r.status)}
    S.tmData=await r.json();setConnectionState(true);tmRender()
  }catch(e){
    if(!S.tmActive)return;setConnectionState(false);
    if(!S.tmData){const tiles=document.getElementById('tmTiles');tiles.textContent=e.name==='AbortError'?'Сервер не отвечает':'Не удалось загрузить метрики: '+e.message}
  }finally{
    clearTimeout(timeout);if(S.tmController===controller)S.tmController=null;
    if(S.tmActive)S.tmRefresh=setTimeout(tmFetch,document.hidden?5000:3000)
  }
}
document.addEventListener('visibilitychange',()=>{if(S.tmActive&&!document.hidden){if(S.tmRefresh)clearTimeout(S.tmRefresh);tmFetch()}});
function tmRender(){
  if(!S.tmData)return;const d=S.tmData;
  const q=(document.getElementById('tmSearch').value||'').toLowerCase();
  let procs=d.processes.filter(p=>p.name.toLowerCase().includes(q)||(p.user||'').toLowerCase().includes(q)||p.pid.toString().includes(q));
  const sb=S.tmSortBy,sd=S.tmSortDir;
  procs.sort((a,b)=>{
    let va,vb;
    switch(sb){
      case'pid':va=a.pid;vb=b.pid;break;
      case'cpu':va=a.cpu;vb=b.cpu;break;
      case'mem':va=processMemoryKb(a);vb=processMemoryKb(b);break;
      case'user':va=(a.user||'').toLowerCase();vb=(b.user||'').toLowerCase();break;
      default:va=(a.name||'').toLowerCase();vb=(b.name||'').toLowerCase()
    }
    return typeof va==='string'?(sd==='asc'?va.localeCompare(vb):vb.localeCompare(va)):(sd==='asc'?va-vb:vb-va)
  });
  const canKill=!!(SESSION&&SESSION.accountType==='installer_admin');
  const cols=[{key:'name',label:'Имя процесса'},{key:'pid',label:'PID'},{key:'cpu',label:'CPU %'},{key:'mem',label:'Память (RSS)'},{key:'user',label:'Пользователь'}];if(canKill)cols.push({key:'kill',label:'Действие'});
  var tmThead=document.getElementById('tmThead');tmThead.innerHTML='<tr>'+cols.map(c=>{const s=S.tmSortBy===c.key?'sorted':'';const a=S.tmSortBy===c.key?(S.tmSortDir==='asc'?'▲':'▼'):'';return'<th class="'+s+'" onclick="tmSort(\''+c.key+'\')">'+c.label+'<span class="sort-arrow">'+a+'</span></th>'}).join('')+'</tr>';translateUiDom(tmThead);
  var tmTbody=document.getElementById('tmTbody');tmTbody.innerHTML=procs.slice(0,500).map(p=>{
    const pid=Number(p.pid);if(!Number.isSafeInteger(pid))return '';
    const cpu=metricPercent(p.cpu),memory=metricPercent(p.mem),memoryKb=processMemoryKb(p);
    return '<tr class="process-row" tabindex="0" aria-haspopup="dialog" onclick="openProcessModal('+pid+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openProcessModal('+pid+')}"><td class="proc-name">'+esc(p.name)+'</td><td>'+pid+'</td><td class="proc-cpu">'+esc(formatProcessPercent(cpu))+'%</td><td class="proc-mem" title="'+esc(formatProcessPercent(memory))+'% ОЗУ">'+esc(fmtSize(memoryKb*1024))+'</td><td class="proc-user">'+esc(p.user||'—')+'</td>'+(canKill?'<td><button class="process-kill" onclick="event.stopPropagation();killProc('+pid+')" title="Завершить процесс">Завершить</button></td>':'')+'</tr>'
  }).join('');translateUiDom(tmTbody);
  var tmCount=document.getElementById('tmCount');tmCount.innerHTML=procs.length+' <span>процессов</span>';translateUiDom(tmCount);
  renderTiles(d)
}
async function killProc(pid){
  const processInfo=S.tmData&&S.tmData.processes.find(item=>item.pid===pid),name=processInfo?processInfo.name:'';
  if(!confirm('Убить процесс '+pid+' ('+name+')?'))return;
  try{const r=await fetch('/api/kill/'+encodeURIComponent(pid),{method:'POST'});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'HTTP '+r.status);notify('✅ Процесс '+pid+' убит','success');tmFetch()}catch(e){notify('❌ '+e.message,'error')}
}
let processModalSerial=0;
async function openProcessModal(pid){
  const serial=++processModalSerial,modal=document.getElementById('modalContent');
  modal.classList.add('wide');modal.innerHTML=modalHeader('Сведения о процессе','Получение актуальных метрик','activity')+'<div class="process-loading">'+nixIcon('activity')+' Загрузка сведений о процессе…</div>';
  document.getElementById('modalOverlay').classList.add('show');
  try{
    const response=await fetch('/api/process/'+encodeURIComponent(pid));if(serial!==processModalSerial)return;
    const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'HTTP '+response.status);
    const processInfo=data.process,details=processInfo.details||{};
    let started='—';
    if(processInfo.started){const date=new Date(processInfo.started);if(!Number.isNaN(date.getTime()))started=date.toLocaleString('ru')}
    const row=(label,value,wide=false)=>value===null||value===undefined||value===''?'':'<div class="process-detail'+(wide?' wide':'')+'"><span>'+esc(label)+'</span><strong>'+esc(value)+'</strong></div>';
    const content=[
      row('PID',pid),row('Пользователь',processInfo.user),row('Состояние',details.state||processInfo.state),row('Родительский PID',details.parentPid),
      row('CPU',formatProcessPercent(processInfo.cpu)+'%'),row('Доля ОЗУ',formatProcessPercent(processInfo.mem)+'%'),
      row('Память RSS',details.vmRssKb!==undefined?fmtSize(details.vmRssKb*1024):formatProcessMemory(processInfo)),
      row('VSZ',details.vmSizeKb!==undefined?fmtSize(details.vmSizeKb*1024):'—'),row('Потоки',details.threads),row('UID',details.uid),
      row('Прочитано с диска',details.readBytes!==undefined?fmtSize(details.readBytes):'—'),row('Записано на диск',details.writeBytes!==undefined?fmtSize(details.writeBytes):'—'),
      row('Запущен',started),row('Команда',processInfo.command||processInfo.name,true),row('Исполняемый файл',details.executable,true),row('Рабочая папка',details.cwd,true),
      row('Аргументы',Array.isArray(details.arguments)?details.arguments.join(' '):'',true)
    ].join('');
    modal.innerHTML=modalHeader(processInfo.name,'PID '+pid+' · '+(processInfo.user||'unknown'),'activity')+'<div class="process-details">'+content+'</div><div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Закрыть</button>'+(SESSION&&SESSION.accountType==='installer_admin'?'<button class="btn-danger" id="processModalKill">'+nixIcon('trash')+' Завершить процесс</button>':'')+'</div>';
    const killButton=document.getElementById('processModalKill');if(killButton)killButton.onclick=()=>{closeModal();killProc(pid)};
    translateUiDom(modal)
  }catch(error){
    if(serial!==processModalSerial)return;modal.innerHTML=modalHeader('Сведения о процессе','Не удалось получить данные','info')+'<div class="no-access">'+esc(error.message)+'</div><div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Закрыть</button></div>'
  }
}
function tmSort(key){
  if(S.tmSortBy===key)S.tmSortDir=S.tmSortDir==='asc'?'desc':'asc';
  else{S.tmSortBy=key;S.tmSortDir=key==='name'?'asc':'desc'}
  tmRender()
}
function metricPercent(value){const number=Number(value);return Number.isFinite(number)?Math.max(0,Math.min(100,number)):0}
function formatProcessPercent(value){const number=metricPercent(value);return number>0&&number<0.01?'<0.01':number.toFixed(2)}
function processMemoryKb(processInfo){const value=Number(processInfo&&processInfo.memRssKb!==undefined?processInfo.memRssKb:processInfo&&processInfo.memRss);return Number.isFinite(value)?Math.max(0,value):0}
function formatProcessMemory(processInfo){return fmtSize(processMemoryKb(processInfo)*1024)}
function renderTiles(d){
  const cpu=d.cpu,mem=d.memory,disk=d.diskIO,net=d.network[0]||{rx_sec:0,tx_sec:0},memPct=mem.total>0?metricPercent(mem.used/mem.total*100):0;
  const tile=(title,value,sub,color,percent=null)=>{
    const width=metricPercent(percent),bar=percent===null?'':'<div class="tile-bar" role="progressbar" aria-valuenow="'+width+'" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:'+width+'%;background:'+color+'"></div></div>';
    return '<div class="tm-tile"><div class="tile-title">'+title+'</div><div class="tile-value" style="color:'+color+'">'+value+'</div><div class="tile-sub">'+sub+'</div>'+bar+'</div>'
  };
  const tiles=[
    tile(nixIcon('activity')+'<span>CPU ('+cpu.cores+' ядер)</span>',metricPercent(cpu.currentLoad).toFixed(1)+'%','Загрузка системы','var(--cpu-color)',cpu.currentLoad),
    tile(nixIcon('memory')+'<span>Память · '+(mem.total/1024**3).toFixed(1)+' GB</span>',memPct.toFixed(1)+'%',(mem.used/1024**3).toFixed(1)+' / '+(mem.total/1024**3).toFixed(1)+' GB','var(--mem-color)',memPct),
    tile(nixIcon('hard-drive')+'<span>Диск · чтение/запись</span>',fmtBytes(disk.rIO_sec||0)+'/s',fmtBytes(disk.wIO_sec||0)+'/s','var(--disk-color)'),
    tile(nixIcon('network')+'<span>Сеть · вход/исход</span>',fmtBytes(net.rx_sec)+'/s',fmtBytes(net.tx_sec)+'/s','var(--net-color)')
  ];
  const gpu=d.gpu&&d.gpu[0];
  if(gpu)tiles.push(tile(nixIcon('monitor')+'<span>GPU</span>',metricPercent(gpu.gpuUtil).toFixed(1)+'%',esc(gpu.name||'GPU'),'var(--gpu-color)',gpu.gpuUtil));
  const rows=[];
  if(window.matchMedia('(max-width: 600px)').matches&&tiles.length>3){
    for(let index=0;index<tiles.length;){const remaining=tiles.length-index,size=remaining===3?3:Math.min(2,remaining);rows.push(tiles.slice(index,index+size));index+=size}
  }else rows.push(tiles);
  const tmTiles=document.getElementById('tmTiles');
  tmTiles.innerHTML=rows.map(row=>'<div class="tm-tile-row" style="--tile-count:'+row.length+'">'+row.join('')+'</div>').join('');translateUiDom(tmTiles)
}
window.matchMedia('(max-width: 600px)').addEventListener('change',()=>{if(S.tmData)renderTiles(S.tmData)});

function getTerminalTheme(){
  const style=getComputedStyle(document.documentElement),accent=style.getPropertyValue('--file-selection-color').trim()||style.getPropertyValue('--accent').trim()||'#8A2BE2',text=style.getPropertyValue('--text').trim()||'#e0e0e0';
  const withAlpha=(hex,alpha)=>/^#[0-9a-f]{6}$/i.test(hex)?hex+Math.round(alpha*255).toString(16).padStart(2,'0'):'#8A2BE280';
  return {background:'#000',foreground:text,cursor:accent,selectionBackground:withAlpha(accent,.5),selectionInactiveBackground:withAlpha(accent,.25),selectionForeground:text}
}
function initTerm(){
  window.__termInited=true;
  if(typeof Terminal==='undefined'||typeof FitAddon==='undefined'){setTimeout(initTerm,500);return}
  window.__term=new Terminal({
    cursorBlink:true,
    fontSize:13,
    fontFamily:'Cascadia Mono, Consolas, monospace',
    lineHeight:1.25,
    scrollback:5000,
    theme:getTerminalTheme()
  });
  var fitAddon=new FitAddon.FitAddon();
  window.__fitAddon=fitAddon;
  window.__term.loadAddon(fitAddon);
  window.__term.open(document.getElementById('terminal'));
  fitAddon.fit();
  window.__term.onData(data=>{if(window.__socket&&window.__socket.connected)window.__socket.emit('term_input',data)});
  const socket=io('/terminal');
  window.__socket=socket;
  socket.on('term_output',data=>{if(window.__term)window.__term.write(data)});
  socket.on('term_info',info=>{if(info&&info.message)notify(info.message,info.restricted?'info':'success')});
  socket.on('connect_error',error=>{setConnectionState(false);notify('❌ Терминал: '+error.message,'error')});
  socket.on('panel_locked',()=>window.location.replace('/block.html'));
  socket.on('connect',()=>{
    socket.emit('term_input','\r');
    const pending=Array.isArray(window.__pendingTermCommands)?window.__pendingTermCommands.splice(0):[];
    pending.forEach(command=>socket.emit('term_input',command));
    socket.emit('term_resize',{cols:window.__term.cols,rows:window.__term.rows})
  });
  window.__term.write('NIX Panel — Терминал\r\n');
  // Пересчитываем размер сетки при любом изменении размера контейнера
  // (перетаскивание ручки, фуллскрин, изменение окна браузера) и сообщаем
  // новый cols/rows бэкенду, чтобы PTY реально знал актуальный размер.
  var termEl=document.getElementById('terminal');
  var ro=new ResizeObserver(function(){
    if(!window.__fitAddon||!window.__term)return;
    var prevCols=window.__term.cols,prevRows=window.__term.rows;
    fitAddon.fit();
    if(window.__term.cols!==prevCols||window.__term.rows!==prevRows){
      if(window.__socket&&window.__socket.connected)window.__socket.emit('term_resize',{cols:window.__term.cols,rows:window.__term.rows})
    }
  });
  ro.observe(termEl);
  window.__termResizeObserver=ro
}

function fmtSize(s){let value=Number(s);if(s===null||s===undefined||!Number.isFinite(value)||value<0)return'—';const units=['B','KB','MB','GB','TB'];let index=0;while(value>=1024&&index<units.length-1){value/=1024;index++}return (value===0?'0':value.toFixed(1))+' '+units[index]}
function fmtBytes(s){if(!s)return'0 B';var u=['B','KB','MB','GB','TB'];var i=0;while(s>=1024&&i<u.length-1){s/=1024;i++}return s.toFixed(s<10?1:0)+' '+u[i]}

document.querySelectorAll('.tab-btn[data-tab]').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.tab-btn').forEach(function(x){x.classList.remove('active')});
    document.querySelectorAll('.tab-panel').forEach(function(x){x.classList.remove('active')});

    if(b.dataset.tab==='tasks')startTm();else stopTm()
  })
});

let securityLastSeen = Date.now();
let securityTimer = null;
let panelLockTimer = null;
function startPanelLockMonitor(){
  if(panelLockTimer)clearTimeout(panelLockTimer);
  const check=async()=>{
    if(document.hidden){panelLockTimer=setTimeout(check,15000);return}
    try{
      const r=await fetch('/api/security/status',{cache:'no-store'});
      if(!r.ok)return;
      const d=await r.json();
      if(d.locked || d.setupRequired){panelLockTimer=null;window.location.replace('/block.html');return}
    }catch(e){}
    panelLockTimer=setTimeout(check,10000)
  };
  check()
}
function startSecurityMonitor(){
  if(securityTimer)clearInterval(securityTimer);
  securityLastSeen = Date.now();
  const poll=async()=>{
    try{
      const r=await fetch('/api/security/events?since='+securityLastSeen);
      if(!r.ok)return;
      const events=await r.json();
      events.forEach(ev=>{
        securityLastSeen=Math.max(securityLastSeen, Number(ev.time)||securityLastSeen);
        if(ev.type==='login_success') notify('🔐 Вход в панель: '+(ev.login||'неизвестный пользователь'),'info');
        else if(ev.type==='login_failed') notify('🚨 Неудачная попытка входа: '+(ev.login||'неизвестный логин'),'error',true);
        else if(ev.type==='manual_lock') notify('🔒 Панель была заблокирована','error',true);
      });
    }catch(e){}
  };
  poll(); securityTimer=setInterval(poll,4000);
}

var chatSocket=null;
function findChatMessage(id){return Array.from(document.querySelectorAll('.chat-msg[data-msg-id]')).find(element=>element.dataset.msgId===String(id))||null}
function handleSecurityEvent(ev){
  if(ev.type==='login_success')notify('🔐 Вход в панель: '+(ev.login||'неизвестный пользователь'),'info');
  else if(ev.type==='login_failed')notify('🚨 Неудачная попытка входа: '+(ev.login||'неизвестный логин'),'error',true);
  else if(ev.type==='manual_lock')notify('🔒 Панель была заблокирована','error',true)
}
function initChat(){
  if(!SESSION||!SESSION.permissions||!SESSION.permissions.chatRead)return;
  chatSocket=io();
  chatSocket.on('chat_msg',function(msg){if(msg.requestId)clearAiPending(msg.requestId);addChatMsg(msg);notify('💬 '+msg.login+': '+(msg.text||((msg.attachments&&msg.attachments.length)||msg.type!=='text'?'📎 файл':'')),'info')});
  chatSocket.on('ai_status',function(status){if(status&&status.requestId)setAiPending(status.requestId,status.active)});
  chatSocket.on('chat_delete',function(id){const element=findChatMessage(id);if(element)element.remove()});
  chatSocket.on('chat_attachment_delete',()=>loadChatMessages());
  chatSocket.on('security_event',handleSecurityEvent);
  chatSocket.on('panel_locked',()=>window.location.replace('/block.html'));
  chatSocket.on('connect',function(){setConnectionState(true);loadChatMessages()});
  chatSocket.on('connect_error',()=>setConnectionState(false))

async function loadChatMessages(){
  try{
    const response=await fetch('/api/chat/messages');if(!response.ok)return;
    const messages=await response.json(),element=document.getElementById('chatMessages');if(!element||!Array.isArray(messages))return;
    element.replaceChildren();messages.forEach(addChatMsg);element.scrollTop=element.scrollHeight
  }catch(e){}
}
function renderChatTextWithLinks(text){
  const source=String(text||'');
  if(!window.marked||!window.DOMPurify)return esc(source).replace(/\r?\n/g,'<br>');
  const rendered=window.marked.parse(source,{gfm:true,breaks:true});
  return window.DOMPurify.sanitize(rendered,{
    USE_PROFILES:{html:true},
    FORBID_TAGS:['script','style','iframe','object','embed','form','input','button','meta','link','base','img','picture','video','audio','source'],
    FORBID_ATTR:['style','srcset','formaction'],
    ALLOW_DATA_URI:false,
    ALLOW_UNKNOWN_PROTOCOLS:false
  })
}
async function copyTextWithFallback(text){
  const area=document.createElement('textarea');area.value=text;area.readOnly=true;area.style.cssText='position:fixed;left:-10000px;top:0;opacity:0';
  document.body.appendChild(area);area.select();let copied=false;
  try{copied=document.execCommand('copy')}finally{area.remove()}
  if(copied)return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    await Promise.race([navigator.clipboard.writeText(text),new Promise((resolve,reject)=>setTimeout(()=>reject(new Error('clipboard timeout')),800))]);return
  }
  throw new Error('copy failed')
}
function enhanceChatMessage(element){
  element.querySelectorAll('[data-chat-media]').forEach(link=>{
    link.onclick=event=>{event.preventDefault();openMediaPlayer(link.getAttribute('href'),document.querySelector('.tab-btn[data-tab="chat"]'))}
  });
  element.querySelectorAll('.msg-text a:not([data-chat-media]):not([data-chat-file])').forEach(link=>{
    const url=String(link.getAttribute('href')||'');
    if(!/^https?:\/\//i.test(url)){link.replaceWith(document.createTextNode(link.textContent||url));return}
    link.href='#';link.classList.add('chat-link');link.dataset.url=encodeURIComponent(url);link.onclick=event=>externalLinkPrompt(event,link.dataset.url)
  });
  element.querySelectorAll('.msg-text pre').forEach(pre=>{
    const wrapper=document.createElement('div');wrapper.className='code-block';
    const button=document.createElement('button');button.type='button';button.className='copy-code';button.title='Копировать код';button.setAttribute('aria-label','Копировать код');button.innerHTML=nixIcon('copy');
    button.onclick=async()=>{button.disabled=true;try{await copyTextWithFallback(pre.textContent||'');notify('Код скопирован','success')}catch(e){notify('Не удалось скопировать код','error')}finally{button.disabled=false}};
    pre.parentNode.insertBefore(wrapper,pre);wrapper.appendChild(button);wrapper.appendChild(pre)
  })
}
function chatFormat(type){
  const input=document.getElementById('chatInput'),start=input.selectionStart,end=input.selectionEnd,selected=input.value.slice(start,end)||(type==='block'?'код':'текст');
  let before='**',after='**';
  if(type==='italic'){before='_';after='_'}else if(type==='code'){before='`';after='`'}else if(type==='block'){before='```\n';after='\n```'}
  input.setRangeText(before+selected+after,start,end,'end');input.focus();input.setSelectionRange(start+before.length,start+before.length+selected.length);autoResizeChatInput(input)
}

function safeUploadUrl(value){const match=String(value||'').match(/^\/uploads\/([A-Za-z0-9._-]+)$/);return match?'/uploads/'+encodeURIComponent(match[1]):''}
function addChatMsg(m){
  const list=document.getElementById('chatMessages');if(!list)return;
  const shouldScroll=list.scrollHeight-list.scrollTop-list.clientHeight<80,isAI=m.login==='🤖 AI',own=m.login===SESSION.login;
  const element=document.createElement('div');element.className='chat-msg'+(own?' own':'');
  element.dataset.msgId=String(m.id||'');
  if(isAI){element.classList.add(m.aiPending?'ai-thinking':'ai-message');if(m.requestId)element.dataset.aiRequest=String(m.requestId);if(m.aiPending)element.dataset.aiPending='true'}
  element.oncontextmenu=event=>chatCtxMenu(event,String(m.id||''),String(m.login||''));
  if(isAI){element.style.borderLeft='2px solid #9B59B6';element.style.background='rgba(155,89,182,0.1)'}
  else{
    const color=/^#[0-9a-f]{6}$/i.test(String(m.chatColor||''))?m.chatColor:'var(--accent)',customBackground=/^#[0-9a-f]{6}$/i.test(String(m.chatBgColor||''))?m.chatBgColor:'';
    element.style.borderLeft='2px solid '+color;element.style.background=customBackground||(own?'color-mix(in srgb, var(--accent) 13%, var(--surface2))':'var(--surface2)')
  }
  const author=String(m.login||'?');
  const time=new Date(m.time).toLocaleString('ru',{hour:'2-digit',minute:'2-digit'});
  let html='<div class="msg-content">';
  if(m.replyTo){
    let replyText='сообщение';const replyElement=findChatMessage(m.replyTo),replyTextElement=replyElement&&replyElement.querySelector('.msg-text');
    if(replyTextElement){const value=replyTextElement.textContent||'';replyText=value.length>50?value.substring(0,50)+'...':value}
    html+='<button type="button" class="msg-reply" title="Перейти к сообщению">'+nixIcon('chat')+' Ответ: '+esc(replyText)+'</button>'
  }
  html+='<div class="msg-user">'+esc(author)+'</div><div class="msg-text markdown-body">';
  if(m.type==='text'){
    if(m.text)html+=renderChatTextWithLinks(m.text);
    (Array.isArray(m.attachments)?m.attachments:[]).forEach(attachment=>{html+=renderChatAttachment(attachment)})
  }else html+=renderChatAttachment({name:m.text||'file',type:m.type,filePath:m.filePath,fileSize:m.fileSize});
  html+='</div><div class="msg-time">'+time+'</div></div>';element.innerHTML=html;
  enhanceChatMessage(element);
  const reply=element.querySelector('.msg-reply');if(reply)reply.onclick=()=>scrollToMsg(m.replyTo);
  list.appendChild(element);
  const chatTab=document.getElementById('tab-chat');
  if((!chatTab||chatTab.classList.contains('active'))&&(shouldScroll||own))list.scrollTop=list.scrollHeight
}
function renderChatAttachment(attachment){
  const name=esc(attachment.name||attachment.text||'file'),filePath=safeUploadUrl(attachment.filePath),size=fmtSize(attachment.fileSize||attachment.size||0),fileIcon=nixIcon('paperclip');
  if(!filePath)return '<span class="msg-file">'+fileIcon+name+'</span>';
  if(attachment.type==='image')return '<a href="'+filePath+'" target="_blank" rel="noopener noreferrer" data-chat-media="image"><img class="msg-media msg-image" src="'+filePath+'" alt="'+name+'" loading="lazy" decoding="async"></a>';
  if(attachment.type==='video')return '<a href="'+filePath+'" target="_blank" rel="noopener noreferrer" data-chat-media="video"><video class="msg-media msg-video" src="'+filePath+'" controls preload="metadata" playsinline></video></a>';
  if(attachment.type==='audio')return '<a href="'+filePath+'" target="_blank" rel="noopener noreferrer"><audio src="'+filePath+'" controls></audio></a>';
  return '<a class="msg-file" href="'+filePath+'" target="_blank" rel="noopener noreferrer" data-chat-file>'+fileIcon+name+' ('+size+')</a>'
}

function submitAiPrompt(prompt,model,chatMessageId){
  var requestId='ai-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
  setAiPending(requestId,true);
  fetch('/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:prompt,model:model,requestId:requestId,chatMessageId:chatMessageId})})
    .then(function(r){return r.json().catch(function(){return{}}).then(function(data){if(!r.ok)throw new Error(data.error||'AI request failed');return data})})
    .then(function(msg){clearAiPending(requestId);if(msg&&msg.id&&!document.querySelector('[data-msg-id="'+msg.id+'"]'))addChatMsg(msg)})
    .catch(function(error){clearAiPending(requestId);notify('❌ AI: '+translateUiValue(error.message),'error')})
}function chatSend(){
  if(window.chatSending)return;
  if(!SESSION||!SESSION.permissions||!SESSION.permissions.chatWrite){notify('❌ Нет права на отправку','error');return}
  var input=document.getElementById('chatInput');
  var text=input.value.trim(),prompt=null,model=null;
  if(text.startsWith('/ai ')){prompt=text.substring(4).trim();if(!prompt){notify('❌ Enter a prompt','error');return}}
  else if(text.startsWith('/Cai ')){var parts=text.split(' ');model=parts[1];prompt=parts.slice(2).join(' ').trim();if(!prompt){notify('❌ Usage: /Cai model prompt','error');return}}
  if(!text&&!chatPendingFiles.length)return;
  if(chatPendingFiles.length&&(!SESSION.permissions||!SESSION.permissions.chatUpload)){notify('❌ Нет права на загрузку файлов','error');return}
  window.chatSending=true;
  var sendButton=document.getElementById('chatSendButton');if(sendButton)sendButton.disabled=true;
  var body={text:text,attachments:[]};
  if(chatReplyTo)body.replyTo=chatReplyTo;
  chatPendingFiles.reduce(function(chain,attachment){return chain.then(function(){return uploadChatAttachment(attachment)})},Promise.resolve())
    .then(function(){body.attachments=chatPendingFiles.map(function(a){return a.id});return fetch('/api/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})})
    .then(function(r){return r.json().catch(function(){return{}}).then(function(data){if(!r.ok)throw new Error(data.error||'Ошибка отправки');return data})})
    .then(function(message){
      input.value='';autoResizeChatInput(input);chatReplyTo=null;input.placeholder='Напишите сообщение...';
      chatPendingFiles.forEach(function(a){if(a.previewUrl)URL.revokeObjectURL(a.previewUrl)});chatPendingFiles=[];renderChatAttachments();
      if(prompt)submitAiPrompt(prompt,model,message.id)
    })
    .catch(function(error){notify('❌ '+translateUiValue(error.message),'error')})
    .finally(function(){window.chatSending=false;if(sendButton)sendButton.disabled=false})
}
function chatUploadError(xhr,fallback){
  try{var body=JSON.parse(xhr.responseText||'{}');if(body.error||body.message)return translateUiValue(String(body.error||body.message))}catch(e){}
  return translateUiValue(fallback)+(xhr.status?' (HTTP '+xhr.status+')':' (network error)')
}
function chatPaste(event){
  const clipboard=event.clipboardData;if(!clipboard)return;
  const files=[];
  Array.from(clipboard.items||[]).forEach(item=>{
    if(item.kind==='file'&&typeof item.getAsFile==='function'){
      const file=item.getAsFile();if(file)files.push(file)
    }
  });
  if(!files.length&&clipboard.files)Array.from(clipboard.files).forEach(file=>files.push(file));
  if(!files.length)return;
  event.preventDefault();queueChatAttachments(files)
}
var chatPendingFiles=[];
function queueChatAttachments(files){
  if(!files||!files.length)return;
  if(window.chatSending){notify(translateUiValue('Дождитесь отправки текущего сообщения'),'info');return}
  if(!SESSION||!SESSION.permissions||!SESSION.permissions.chatUpload){notify('❌ Нет права на загрузку файлов','error');return}
  Array.from(files).forEach(function(file){
    if(chatPendingFiles.length>=10){notify(translateUiValue('Можно прикрепить не более 10 файлов'),'error');return}
    var image=file.type&&file.type.startsWith('image/');
    chatPendingFiles.push({file:file,id:null,name:file.name,size:file.size,type:image?'image':'file',previewUrl:image?URL.createObjectURL(file):null})
  });
  renderChatAttachments()
}
function renderChatAttachments(){
  var el=document.getElementById('chatAttachments');if(!el)return;
  el.innerHTML='';el.classList.toggle('has-items',chatPendingFiles.length>0);
  chatPendingFiles.forEach(function(a,index){
    var chip=document.createElement('div');chip.className='chat-attachment-chip';
    if(a.previewUrl){var img=document.createElement('img');img.src=a.previewUrl;img.alt='';chip.appendChild(img)}
    else{var icon=document.createElement('span');icon.style.fontSize='20px';icon.textContent='📎';chip.appendChild(icon)}
    var meta=document.createElement('span');meta.className='attachment-meta';meta.title=a.name;meta.appendChild(document.createTextNode(a.name));
    var size=document.createElement('span');size.style.color='var(--text2)';size.textContent=(a.id?'✓ ':'')+fmtSize(a.size);meta.appendChild(document.createElement('br'));meta.appendChild(size);chip.appendChild(meta);
    var remove=document.createElement('button');remove.className='attachment-remove';remove.title=translateUiValue('Убрать вложение');remove.textContent='✕';remove.onclick=function(){removeChatAttachment(index)};chip.appendChild(remove);
    el.appendChild(chip)
  })
}
function removeChatAttachment(index){
  if(window.chatSending)return;
  var a=chatPendingFiles[index];if(!a)return;
  if(a.previewUrl)URL.revokeObjectURL(a.previewUrl);
  if(a.id)fetch('/api/chat/upload/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:a.id})}).catch(function(){});
  chatPendingFiles.splice(index,1);renderChatAttachments()
}
function uploadChatAttachment(a){
  if(a.id)return Promise.resolve(a.id);
  return new Promise(function(resolve,reject){
    var fd=new FormData();fd.append('file',a.file);
    var xhr=new XMLHttpRequest();xhr.open('POST','/api/chat/upload',true);
    var nid=notify('📤 Загрузка: '+a.name,'info',true,function(){xhr.abort()});
    xhr.upload.onprogress=function(e){if(e.lengthComputable)updateNotif(nid,'📤 Загрузка: '+Math.round(e.loaded/e.total*100)+'% ('+fmtSize(e.loaded)+'/'+fmtSize(e.total)+')','info')};
    xhr.onload=function(){completeNotif(nid);dismissNotif(nid);if(xhr.status>=200&&xhr.status<300){try{var d=JSON.parse(xhr.responseText);a.id=d.attachment.id;a.type=d.attachment.type;renderChatAttachments();resolve(a.id)}catch(e){reject(new Error('Не удалось получить данные вложения'))}}else reject(new Error(chatUploadError(xhr,'Ошибка загрузки')))};
    xhr.onerror=function(){completeNotif(nid);dismissNotif(nid);reject(new Error(chatUploadError(xhr,'Ошибка загрузки')))};
    xhr.onabort=function(){completeNotif(nid);dismissNotif(nid);reject(new Error('Загрузка отменена'))};
    xhr.send(fd)
  })
}

function chatDropFile(e){
  e.preventDefault();
  queueChatAttachments(e.dataTransfer.files)
}

// GLOBAL CANCEL MAP
var __CANCEL_MAP = {};

function notify(text,type,persist,onCancel){
  type=type||'info';
  var id=++NOTIF_ID;
  if(onCancel)__CANCEL_MAP[id]=onCancel;
  var el=document.getElementById('notifications');
  var n=document.createElement('div');n.className='notification '+type;n.id='n_'+id;
  n.innerHTML='<span>'+esc(text)+'</span>'+(onCancel?'<span class="notif-cancel" style="margin-left:6px;cursor:pointer;opacity:0.5;font-weight:bold" onclick="cancelNotif('+id+')">✕</span>':'');
  n.onclick=function(){dismissNotif(id)};
  n._onCancel=onCancel||null;
  el.appendChild(n);
  NOTIFICATIONS.push({id:id,text:text,type:type,time:Date.now(),onCancel:onCancel||null});
  if(!persist)setTimeout(function(){dismissNotif(id)},5000);
  return id
}
function dismissNotif(id){
  var n=document.getElementById('n_'+id);
  if(n)n.style.display='none'
}
function completeNotif(id){
  delete __CANCEL_MAP[id];
  for(var i=0;i<NOTIFICATIONS.length;i++){if(NOTIFICATIONS[i].id===id)NOTIFICATIONS[i].onCancel=null}
  var n=document.getElementById('n_'+id);
  if(n){n._onCancel=null;var cancel=n.querySelector('.notif-cancel');if(cancel)cancel.remove()}
}function cancelNotif(id){
  // Try cancel map first, then DOM, then array
  if(__CANCEL_MAP[id]){
    __CANCEL_MAP[id](id);
    delete __CANCEL_MAP[id];
    // Also update array
    for(var i=0;i<NOTIFICATIONS.length;i++){
      if(NOTIFICATIONS[i].id===id){NOTIFICATIONS[i].onCancel=null;break}
    }
    var n=document.getElementById('n_'+id);
    if(n)n.remove()
  }
}
function updateNotif(id,text,type){
  var n=document.getElementById('n_'+id);
  if(!n)return id;
  type=type||'info';
  n.className='notification '+type;
  if(n.style.display==='none')n.style.display='';
  var onCancel=n._onCancel;
  n.innerHTML='<span>'+esc(text)+'</span>'+(onCancel?'<span class="notif-cancel" style="margin-left:6px;cursor:pointer;opacity:0.5;font-weight:bold" onclick="cancelNotif('+id+')">✕</span>':'');
  n._onCancel=onCancel;
  // Update stored notification
  for(var i=0;i<NOTIFICATIONS.length;i++){
    if(NOTIFICATIONS[i].id===id){NOTIFICATIONS[i].text=text;NOTIFICATIONS[i].type=type;NOTIFICATIONS[i].onCancel=onCancel;break}
  }
  return id
}
function openNotifCenter(){
  const m=document.getElementById('modalContent');m.classList.add('wide');
  let html=modalHeader('Центр уведомлений',NOTIFICATIONS.length?'События: '+NOTIFICATIONS.length:'Системные события и статус операций','bell');
  if(!NOTIFICATIONS.length)html+='<div class="empty-state notification-empty">'+nixIcon('bell')+'<strong>Уведомлений пока нет</strong><p>Здесь появятся новые события и результаты операций.</p></div>';
  else{
    html+='<div class="notification-list">';
    NOTIFICATIONS.slice().reverse().forEach(function(n){
      const type=n.type==='error'||n.type==='success'?n.type:'info',date=new Date(n.time),time=date.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      const cancel=n.onCancel?'<button class="notification-cancel" onclick="cancelNotif('+Number(n.id)+')" title="Отменить операцию" aria-label="Отменить операцию">'+nixIcon('x')+'</button>':'';
      html+='<div class="notification-entry '+type+'"><span class="notification-entry-icon">'+nixIcon(type==='error'?'info':type==='success'?'check':'bell')+'</span><div><p>'+esc(CURRENT_LANG==='ru'?n.text:translateUiValue(n.text))+'</p><time>'+esc(time)+'</time></div>'+cancel+'</div>'
    });
    html+='</div>'
  }
  html+='<div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Закрыть</button></div>';
  m.innerHTML=html;translateUiDom(m);document.getElementById('modalOverlay').classList.add('show')
}

async function loadWakeDevices(){
  const el=document.getElementById('wolDevices');if(!el)return;
  try{
    const response=await fetch('/api/devices',{cache:'no-store'}),devices=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(devices.error||'HTTP '+response.status);
    if(!Array.isArray(devices)||!devices.length){
      el.innerHTML='<div class="empty-state">'+nixIcon('monitor')+'<strong>Нет сохранённых устройств</strong><p>Добавьте компьютер ниже, чтобы включать его через Wake-on-LAN.</p></div>';
      return;
    }
    el.innerHTML=devices.map(function(device){
      const name=device.name||'Без имени';
      return '<article class="wake-device"><span class="wake-device-icon">'+nixIcon('monitor')+'</span><div class="wake-device-info"><strong>'+esc(name)+'</strong><span class="wake-device-mac">'+esc(device.mac||'')+'</span></div><div class="wake-device-actions"><button class="user-action wake-button" onclick="wakeDevice(\''+escJs(device.mac||'')+'\')" aria-label="Включить '+esc(name)+'">'+nixIcon('zap')+' Включить</button><button class="user-action danger" onclick="deleteWakeDevice(\''+escJs(String(device.id))+'\')" title="Удалить устройство" aria-label="Удалить '+esc(name)+'">'+nixIcon('trash')+'</button></div></article>'
    }).join('');
  }catch(error){

  }
}
async function wakeDevice(mac){
  try{
    var r=await fetch('/api/wake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mac:mac})});
    var d=await r.json().catch(function(){return{success:false,error:'HTTP '+r.status}});
    if(r.ok&&d.success)notify('⚡ Magic Packet отправлен: '+mac,'success');
    else notify('❌ Не удалось отправить Wake-on-LAN: '+(d.error||'неизвестная ошибка'),'error');
  }catch(e){notify('❌ Ошибка Wake-on-LAN: '+e.message,'error')}
}
async function addWakeDevice(){
  var name=(document.getElementById('wolName').value||'').trim();
  var mac=(document.getElementById('wolMac').value||'').trim();
  if(!name){notify('Введите название устройства','error');return}
  if(!/^(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$/.test(mac)){notify('Некорректный MAC-адрес','error');return}
  try{
    var r=await fetch('/api/devices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,mac:mac})});
    var d=await r.json().catch(function(){return{}});
    if(!r.ok)throw new Error(d.error||'HTTP '+r.status);
    document.getElementById('wolName').value='';document.getElementById('wolMac').value='';
    notify('✅ Устройство добавлено','success');
    await loadWakeDevices();
  }catch(e){notify('❌ '+e.message,'error')}
}
async function deleteWakeDevice(id){
  if(!confirm('Удалить это устройство из Wake-on-LAN?'))return;
  try{
    var r=await fetch('/api/devices/'+encodeURIComponent(id),{method:'DELETE'});
    var d=await r.json().catch(function(){return{}});
    if(!r.ok)throw new Error(d.error||'HTTP '+r.status);
    await loadWakeDevices();
  }catch(e){notify('❌ '+e.message,'error')}
}

async function changeOwnPassword(){
  const current=document.getElementById('currentPassword'),next=document.getElementById('newPassword'),repeat=document.getElementById('newPasswordRepeat');
  if(!current.value){notify('❌ Введите текущий пароль','error');return}
  if(next.value.length<8){notify('❌ Новый пароль должен содержать минимум 8 символов','error');return}
  if(next.value!==repeat.value){notify('❌ Новые пароли не совпадают','error');return}
  try{
    const response=await fetch('/api/me/password',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:current.value,newPassword:next.value})});
    const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Не удалось изменить пароль');
    current.value='';next.value='';repeat.value='';notify('✅ Пароль изменён. Другие сессии отключены.','success')
  }catch(e){notify('❌ '+e.message,'error')}
}

// ============================================================
// REMOTE CONTROL
// Скриншоты грузятся через fetch (а не <img src>), поэтому ошибки сервера
// показываются текстом поверх экрана, а не «иконкой сломанного файла».
// ============================================================
var remoteMonitors = [];          // оставлено для совместимости со старым кодом инициализации
var remoteRunning = false;
var remoteTimer = null;
var remoteLastUrl = null;
var remoteSourceWidth = 0, remoteSourceHeight = 0;
var remoteQueue = Promise.resolve();

// Ошибки должны повисеть не меньше 10 секунд, даже если за это время успешно
// прогрузился следующий кадр — remoteStatusUntil хранит момент, раньше
// которого статус нельзя скрывать/затирать.
var remoteStatusUntil = 0;
function remoteShowStatus(text){
  var el=document.getElementById('remoteStatus');
  if(!el)return;
  if(text){
    el.classList.remove('status-success','status-info','status-warning','status-error');
    var cls=text.indexOf('✅')===0?'status-success':(text.indexOf('⚠️')===0?'status-warning':(text.indexOf('❌')===0?'status-error':'status-info'));
    el.classList.add(cls);el.textContent=text;el.style.display='block';
    remoteStatusUntil=Date.now()+10000
  }else{
    if(Date.now()<remoteStatusUntil)return;
    el.style.display='none'
  }
}
function openRemote(){
  document.getElementById('remotePanel').classList.add('open');
  var screen=document.getElementById('remoteScreen');
  screen.onclick=function(e){remoteImgClick(e,1)};
  screen.oncontextmenu=function(e){e.preventDefault();remoteImgClick(e,3);return false};
  screen.onauxclick=function(e){if(e.button===1){e.preventDefault();remoteImgClick(e,2)}};
  screen.onmousemove=remoteHoverMove;
  screen.onmouseleave=function(){remoteHoverTarget=null};
  remoteHoverLast=null;remoteHoverTarget=null;remoteHoverBusy=false;
  var body=document.getElementById('remoteBody');
  body.tabIndex=0;
  body.onkeydown=function(e){remoteKeyDown(e)};
  body.focus();
  body.onpointerdown=function(){body.focus()};
  if(!window.__remoteGlobalKeys){window.__remoteGlobalKeys=function(e){if(!remoteRunning)return;if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable))return;if(['Control','Shift','Alt','Meta','CapsLock','Dead','Process'].includes(e.key))return;e.preventDefault();remoteSend({action:'key',key:e.key,ctrl:e.ctrlKey,alt:e.altKey,shift:e.shiftKey,meta:e.metaKey})};window.addEventListener('keydown',window.__remoteGlobalKeys,true)}
  remoteStop();
  remoteRunning=true;
  remoteLoop();
  // Start the Wayland input backend before the first interaction.
  setTimeout(remoteConnectInput,150);
  setTimeout(function(){var img=document.getElementById('remoteScreen');if(img){img.style.width='100%';img.style.height='100%';}var body=document.getElementById('remoteBody');if(body)body.scrollTop=0;},50);
}
function remoteStop(){
  remoteRunning=false;
  if(remoteTimer){clearTimeout(remoteTimer);remoteTimer=null}
}
function closeRemote(){
  document.getElementById('remotePanel').classList.remove('open');
  remoteStop();
  remoteHoverTarget=null;
  remoteDiagClose()
}
function remoteFullscreen(){
  document.getElementById('remotePanel').classList.toggle('fullscreen')
}
function remoteRefresh(){
  remoteStop();remoteRunning=true;remoteLoop()
}
// Один запрос за раз: следующий кадр запрашивается только после завершения предыдущего
async function remoteLoop(){
  if(!remoteRunning)return;
  var frameStarted=performance.now();
  var delay=document.hidden?1000:66;
  try{
    var r=await fetch('/api/system/remote/screenshot?format=webp&t='+Date.now(),{cache:'no-store'});
    var ct=r.headers.get('content-type')||'';
    remoteSourceWidth=parseInt(r.headers.get('X-Image-Width')||'0',10)||0;
    remoteSourceHeight=parseInt(r.headers.get('X-Image-Height')||'0',10)||0;
    if(r.ok&&ct.indexOf('image')===0){
      var blob=await r.blob();
      var url=URL.createObjectURL(blob);
      var img=document.getElementById('remoteScreen');
      var prev=remoteLastUrl;
      img.onload=function(){if(prev)URL.revokeObjectURL(prev)};
      img.src=url;
      remoteLastUrl=url;
      remoteShowStatus('')
    }else{
      var msg;
      try{msg=(await r.json()).error}catch(e){msg=(r.redirected||r.status===200)?'Сессия истекла — войдите заново':('HTTP '+r.status)}
      remoteShowStatus('❌ Не удалось получить экран:\n'+msg+'\n\nНажмите 🩺 для диагностики.');
      delay=4000
    }
  }catch(e){
    remoteShowStatus('❌ Нет связи с панелью: '+e.message);
    delay=4000
  }
  if(remoteRunning)remoteTimer=setTimeout(remoteLoop,Math.max(0,delay-(performance.now()-frameStarted)))
}
// Все команды ввода идут строго по очереди, чтобы не перепутался порядок
function remoteSend(payload){
  remoteQueue=remoteQueue.then(function(){
    return fetch('/api/system/remote/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(function(r){return r.json().catch(function(){return{success:false,error:'HTTP '+r.status}})})
      .then(function(d){if(!d.success)remoteShowStatus('❌ Ввод не сработал:\n'+(d.error||'неизвестная ошибка'))})
      .catch(function(e){remoteShowStatus('❌ Нет связи с панелью: '+e.message)})
  });
  return remoteQueue
}
// Координаты на удалённом экране с учётом object-fit:contain
function remoteCoords(e){var img=document.getElementById('remoteScreen');if(!img||!img.naturalWidth)return null;var r=img.getBoundingClientRect(),sc=Math.min(r.width/img.naturalWidth,r.height/img.naturalHeight),ox=(r.width-img.naturalWidth*sc)/2,oy=(r.height-img.naturalHeight*sc)/2,x=Math.round((e.clientX-r.left-ox)/sc),y=Math.round((e.clientY-r.top-oy)/sc);if(x<0||y<0||x>img.naturalWidth||y>img.naturalHeight)return null;var sw=remoteSourceWidth||img.naturalWidth,sh=remoteSourceHeight||img.naturalHeight;if(img.naturalWidth!==sw||img.naturalHeight!==sh){x=Math.round(x*sw/img.naturalWidth);y=Math.round(y*sh/img.naturalHeight)}return{x:x,y:y}}

function remoteImgClick(e,button){
  var c=remoteCoords(e);
  if(!c)return;
  remoteSend({action:'click',button:button,x:c.x,y:c.y});
  setTimeout(remoteRefresh,400)
}
// Слежение за курсором: пока панель открыта, реальный курсор на удалённой
// машине постоянно доводится туда, где сейчас мышь в браузере. Запросы идут
// через ту же очередь remoteSend, что и клики/клавиши — это сохраняет порядок
// (клик всегда происходит после последнего наведения) и не даёт запросам
// копиться: следующее наведение ставится в очередь только после того, как
// предыдущее реально доехало до сервера.
var remoteHoverLast=null, remoteHoverTarget=null, remoteHoverBusy=false;
function remoteHoverSend(){
  if(remoteHoverBusy||!remoteHoverTarget)return;
  var c=remoteHoverTarget;
  remoteHoverTarget=null;
  remoteHoverBusy=true;
  remoteHoverLast=c;
  remoteSend({action:'move',x:c.x,y:c.y}).finally(function(){
    remoteHoverBusy=false;
    remoteHoverSend()
  })
}
function remoteHoverMove(e){
  var c=remoteCoords(e);
  if(!c)return;
  if(remoteHoverLast&&Math.abs(c.x-remoteHoverLast.x)<3&&Math.abs(c.y-remoteHoverLast.y)<3)return;
  remoteHoverTarget=c;
  remoteHoverSend()
}
// Кнопки тулбара кликают там, где сейчас стоит курсор
function remoteClick(button){remoteSend({action:'click',button:button})}
function remoteDblClick(){remoteSend({action:'dblclick',button:1})}
function remoteKeyType(val){
  if(!val)return;
  remoteSend({action:'type',text:val})
}
function remoteKeyDown(e){
  if(e.target&&e.target.id==='remoteKeyInput')return;
  var k=e.key;
  /* Android/mobile browsers may report touch/IME/system events as Unidentified. */
  if(!k||k==='Unidentified')return;
  if(k==='Control'||k==='Shift'||k==='Alt'||k==='Meta'||k==='CapsLock'||k==='Dead'||k==='Process')return;
  e.preventDefault();
  remoteSend({action:'key',key:k,ctrl:e.ctrlKey,alt:e.altKey,shift:e.shiftKey,meta:e.metaKey})
}
// Диагностика — отдельный оверлей поверх всего остального (в т.ч. поверх
// ошибок в remoteStatus) и закрывается только по кнопке ✕, а не по таймеру
// и не при следующем удачном кадре скриншота.
function remoteDiagShow(text){
  document.getElementById('remoteDiagContent').textContent=text;
  document.getElementById('remoteDiag').style.display='block'
}
function remoteDiagClose(){

function remoteConnectInput(){
  remoteShowStatus('⏳ Подключаю управление…');
  fetch('/api/system/remote/input/status',{cache:'no-store'}).then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d}})}).then(function(x){
    var d=x.data||{};
    if(x.ok&&d.state==='ready') remoteShowStatus('✅ Управление через ydotool подключено');
    else remoteShowStatus('❌ Не удалось подключить ввод:\n'+(d.error||'неизвестная ошибка'));
  }).catch(function(e){remoteShowStatus('❌ '+e.message)})
}

    else remoteShowStatus('⚠️ '+(d.error||'Не удалось запустить графическую сессию')+'\n\nОткройте 🩺 Диагностику для подробностей.');
  }).catch(function(e){remoteShowStatus('❌ '+e.message)});

function remoteDiagnose(){

// ============================================================
let spfLoadedFiles=[],spfLoadSerial=0;
function openServerFilePicker(){
  const m=document.getElementById('modalContent');m.classList.add('wide');
  m.innerHTML=modalHeader('Файл с сервера','Выберите файл для отправки в чат','folder')
    +'<div class="server-picker-toolbar"><select id="spfDrive" aria-label="Диск сервера" title="Диск сервера" onchange="spfSelectDrive(this.value)"><option value="/">Корень /</option></select><button type="button" class="picker-icon-button" id="spfBack" onclick="spfBack()" title="Назад" aria-label="Назад" disabled>'+nixIcon('arrow-left')+'</button><button type="button" class="picker-icon-button" id="spfFwd" onclick="spfFwd()" title="Вперёд" aria-label="Вперёд" disabled>'+nixIcon('arrow-right')+'</button><input id="spfPath" aria-label="Путь к папке" spellcheck="false" onkeydown="if(event.key===\'Enter\')spfNavigate(this.value)"><button type="button" class="picker-icon-button" onclick="spfNavigate(document.getElementById(\'spfPath\').value)" title="Перейти по пути" aria-label="Перейти по пути">'+nixIcon('arrow-right')+'</button><button type="button" class="picker-icon-button" onclick="spfLoad(window._spfPath)" title="Обновить" aria-label="Обновить">'+nixIcon('refresh')+'</button></div>'
    +'<div class="server-picker-search">'+nixIcon('search')+'<input id="spfFilter" aria-label="Поиск в текущей папке" placeholder="Поиск в текущей папке…" oninput="window._spfSelected=null;spfRenderFiles()"></div>'
    +'<div id="spfFiles" class="server-picker-files" aria-label="Файлы сервера"></div><div id="spfSelection" class="server-picker-status">Выберите файл или откройте папку</div>'
    +'<div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Отмена</button><button class="btn-primary" id="spfSend" onclick="spfSend()" disabled>'+nixIcon('send')+' Отправить в чат</button></div>';
  translateUiDom(m);document.getElementById('modalOverlay').classList.add('show');
  const startRoot=(SESSION&&SESSION.fileRoot)||'/';
  window._spfPath=startRoot;window._spfHistory=[startRoot];window._spfHistoryIdx=0;window._spfSelected=null;window._spfDrives=[];
  spfLoad(startRoot);spfLoadDrives()
}
async function spfLoadDrives(){
  try{
    const response=await fetch('/api/drives'),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Не удалось получить список дисков');
    window._spfDrives=Array.isArray(data)?data:(data.drives||[]);
    const select=document.getElementById('spfDrive');if(!select)return;select.replaceChildren();
    window._spfDrives.forEach(function(drive){const option=document.createElement('option');option.value=drive.mount;option.textContent=(drive.name||drive.mount)+' ('+drive.mount+')';select.appendChild(option)});
    spfSyncDriveSelect()
  }catch(error){notify('❌ '+error.message,'error')}
}
function spfSyncDriveSelect(){
  const select=document.getElementById('spfDrive');if(!select)return;
  const matches=(window._spfDrives||[]).filter(drive=>window._spfPath===drive.mount||window._spfPath.startsWith(drive.mount.replace(/\/$/,'')+'/')).sort((a,b)=>b.mount.length-a.mount.length);
  select.value=matches.length?matches[0].mount:((SESSION&&SESSION.fileRoot)||'/')
}
function spfUpdateSelection(){
  const selected=window._spfSelected,send=document.getElementById('spfSend'),status=document.getElementById('spfSelection');
  if(send)send.disabled=!selected;
  if(status)status.textContent=selected?selected.name+' · '+fmtSize(selected.size):'Выберите файл или откройте папку';
  document.querySelectorAll('#spfFiles .server-picker-row').forEach(row=>{const active=spfLoadedFiles[Number(row.dataset.index)]===selected;row.classList.toggle('selected',active);row.setAttribute('aria-pressed',String(active))})
}
function spfRenderFiles(){
  const element=document.getElementById('spfFiles');if(!element)return;
  const query=(document.getElementById('spfFilter').value||'').toLowerCase().trim();
  const visible=spfLoadedFiles.map((file,index)=>({file,index})).filter(item=>!query||item.file.name.toLowerCase().includes(query));
  if(!visible.length){element.innerHTML='<div class="empty-state">'+nixIcon('search')+'<strong>Ничего не найдено</strong><p>Измените запрос или откройте другую папку.</p></div>';spfUpdateSelection();return}
  element.innerHTML=visible.map(({file,index})=>{
    const directory=file.isDirectory===true,selected=window._spfSelected===file;
    return '<button type="button" class="server-picker-row'+(directory?' is-directory':'')+(selected?' selected':'')+'" data-index="'+index+'" aria-pressed="'+selected+'" onclick="spfOpen('+index+')" ondblclick="spfSend()"><span class="server-picker-file-icon">'+nixIcon(directory?'folder':'file')+'</span><span class="server-picker-file-name">'+esc(file.name)+'</span><span class="server-picker-file-meta">'+(directory?'Папка':fmtSize(file.size))+'</span>'+nixIcon(directory?'arrow-right':'check')+'</button>'
  }).join('');spfUpdateSelection()
}
async function spfLoad(path){
  const serial=++spfLoadSerial;window._spfPath=String(path||'/').trim()||'/';window._spfSelected=null;spfLoadedFiles=[];spfUpdateSelection();
  const input=document.getElementById('spfPath'),filter=document.getElementById('spfFilter'),element=document.getElementById('spfFiles');
  if(input)input.value=window._spfPath;if(filter)filter.value='';spfSyncDriveSelect();
  const back=document.getElementById('spfBack'),forward=document.getElementById('spfFwd');if(back)back.disabled=window._spfHistoryIdx<=0;if(forward)forward.disabled=window._spfHistoryIdx>=window._spfHistory.length-1;
  if(element)element.innerHTML='<div class="process-loading">'+nixIcon('refresh')+' Загрузка файлов…</div>';
  try{
    const response=await fetch('/api/files?path='+encodeURIComponent(window._spfPath)),data=await response.json().catch(()=>({}));
    if(serial!==spfLoadSerial)return;if(!response.ok)throw new Error(data.error||'Не удалось открыть папку');
    spfLoadedFiles=Array.isArray(data.files)?data.files:(Array.isArray(data)?data:[]);spfRenderFiles()
  }catch(error){if(serial===spfLoadSerial&&element)element.innerHTML='<div class="no-access">'+nixIcon('info')+' '+esc(error.message)+'</div>'}
}
function spfOpen(index){
  const file=spfLoadedFiles[index];if(!file)return;
  if(file.isDirectory){spfNavigate(file.path);return}
  window._spfSelected=file;spfUpdateSelection()
}
function spfSelectDrive(mount){window._spfHistory=[mount];window._spfHistoryIdx=0;window._spfSelected=null;spfLoad(mount)}
function spfNavigate(path){
  window._spfHistory=window._spfHistory.slice(0,window._spfHistoryIdx+1);window._spfHistory.push(path);window._spfHistoryIdx=window._spfHistory.length-1;spfLoad(path)
}
function spfBack(){if(window._spfHistoryIdx>0){window._spfHistoryIdx--;spfLoad(window._spfHistory[window._spfHistoryIdx])}}
function spfFwd(){if(window._spfHistoryIdx<window._spfHistory.length-1){window._spfHistoryIdx++;spfLoad(window._spfHistory[window._spfHistoryIdx])}}
async function spfSend(){
  const file=window._spfSelected;if(!file||file.isDirectory)return;
  const button=document.getElementById('spfSend');if(button)button.disabled=true;
  try{
    const response=await fetch('/api/view?path='+encodeURIComponent(file.path));if(!response.ok)throw new Error('Не удалось прочитать файл');
    const blob=await response.blob(),attachment=new File([blob],file.name,{type:blob.type||'application/octet-stream'});closeModal();queueChatAttachments([attachment])
  }catch(error){notify('❌ '+error.message,'error');if(button)button.disabled=false}
}

// INIT

async function init(){
  await loadSession();
  await loadThemes();
  await loadButtons();
  // Show Wake-on-LAN only for users with the power-management permission.
  if(SESSION&&SESSION.permissions&&SESSION.permissions.power){
    var wolBtn=document.getElementById('wolBtn');
    if(wolBtn)wolBtn.style.display='';
  }
  // Load panel settings
  if(SESSION&&(SESSION.accountType==='installer_admin'||(SESSION.permissions&&SESSION.permissions.chatAdmin))){
    try{var r=await fetch('/api/settings');if(r.ok)PANEL_SETTINGS=await r.json()}catch(e){}
  }
  // Load AI config
  if(SESSION&&SESSION.accountType==='installer_admin'){
    try{var r=await fetch('/api/ai/config');if(r.ok)AI_CONFIG=await r.json()}catch(e){}
  }
  // Load chat color
  loadChatColor();
  // Init chat if permission
  if(SESSION&&SESSION.permissions&&SESSION.permissions.chatRead)initChat();
  // Check permissions for tabs
  if(SESSION&&SESSION.permissions){
    document.querySelectorAll('.tab-btn[data-tab]').forEach(function(btn){
      var tab=btn.dataset.tab;
      var permMap={chat:'chatRead',tasks:'tasks'};
      if(permMap[tab]&&!SESSION.permissions[permMap[tab]]){
        btn.style.display='none';
        var panel=document.getElementById('tab-'+tab);
        if(panel)panel.innerHTML='<div class="no-access">🚫 Нет доступа к этому разделу</div>'
      }
    })
  }
  var fm=createFileManager(SESSION.fileRoot||'/');
  if(fm)fm.tabBtn.click();
  initConsoleResize();
  if(SESSION&&SESSION.accountType==='installer_admin'&&SESSION.permissions&&SESSION.permissions.console){
    fetch('/api/system/gpu').then(function(r){return r.json()}).then(function(data){
      document.getElementById('remoteBtn').style.display='';
      if(data.gpus)remoteMonitors=data.gpus
    }).catch(function(){document.getElementById('remoteBtn').style.display='' })
  }
  // Remote panel resize
  var remoteResize = document.getElementById('remoteResize');
  if(remoteResize){
    remoteResize.addEventListener('mousedown',function(e){
      e.preventDefault();
      var startY=e.clientY;
      var panel=document.getElementById('remotePanel');
      var startH=panel.offsetHeight;
      function onMove(e2){
        var h=Math.max(50,Math.min(window.innerHeight-20,startH-(e2.clientY-startY)));
        panel.style.height=h+'px'
      }
      function onUp(){document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp)}
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp)
    })
  }
}
